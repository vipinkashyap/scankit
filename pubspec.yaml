name: scankit
description: "A modern, lean barcode and QR code scanner for Flutter. Native iOS (VisionKit) and Android (ML Kit + CameraX) implementations."
version: 0.1.0
# homepage: https://github.com/yourusername/scankit
# repository: https://github.com/yourusername/scankit
# issue_tracker: https://github.com/yourusername/scankit/issues

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^25.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.scankit.scankit
        pluginClass: ScankitPlugin
      ios:
        pluginClass: ScankitPlugin
