name: scankit
description: "QR code, barcode & document scanner for Flutter. Native iOS (VisionKit) and Android (ML Kit + CameraX) implementations."
version: 0.1.2
homepage: https://vipinkashyap.github.io/scankit
repository: https://github.com/vipinkashyap/scankit
issue_tracker: https://github.com/vipinkashyap/scankit/issues

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^25.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.scankit.scankit
        pluginClass: ScankitPlugin
      ios:
        pluginClass: ScankitPlugin
